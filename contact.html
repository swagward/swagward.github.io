        <a href="index.html">
            <img src="assets/logo.png" alt="Go to homepage" class="nav-icon">

        <li><a href="projects.html">Projects</a></li>
        <li><a href="contact.html" aria-current="page">Contact</a></li>
        <li>
            <div class="nav-controls">
                <button id="bg-toggle" class="theme-btn" aria-label="Disable background animation">
                    <i class="fas fa-eye" aria-hidden="true"></i>
                </button>
                <button id="theme-toggle" class="theme-btn" aria-label="Toggle theme">
                    <i class="fas fa-moon" aria-hidden="true"></i>
                </button>
                <button id="pause-toggle" class="theme-btn" aria-label="Pause background animation">
                    <i class="fas fa-pause" aria-hidden="true"></i>
                </button>
            </div>
        </li>
    </ul>
</nav>

<main>
    <div class="container">
        <div class="contact-wrapper split">

            <div class="contact-left">
                <h1 class="section-title">Find Me Here</h1>
                <p class="contact-intro">
                    Follow my development journey or reach out directly on these platforms.
                </p>

                <div class="social-links">
                    <button type="button" class="social-btn discord" id="discord-copy" data-tag="@swagward">
                        <i class="fab fa-discord" aria-hidden="true"></i> <span id="discord-label">Discord - @swagward</span>
                    </button>
                    <a href="https://www.youtube.com/@swagward" class="social-btn youtube" target="_blank" rel="noopener noreferrer">
                        <i class="fab fa-youtube" aria-hidden="true"></i> YouTube
                    </a>
                    <a href="https://www.instagram.com/realswagward/" class="social-btn instagram" target="_blank" rel="noopener noreferrer">
                        <i class="fab fa-instagram" aria-hidden="true"></i> Instagram
                    </a>
                    <a href="https://github.com/swagward" class="social-btn github" target="_blank" rel="noopener noreferrer">
                        <i class="fab fa-github" aria-hidden="true"></i> GitHub
                    </a>
                </div>
            </div>

            <div class="contact-right">
                <h2 class="section-title">Contact Me</h2>
                <form action="https://formspree.io/f/xzdakdkr" method="POST">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" placeholder="Enter your name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="email@example.com" required>
                    </div>

                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="5" placeholder="I'd love to hear from you!" required></textarea>
                    </div>

                    <button type="submit" class="btn submit-btn">Send Message</button>
                </form>
            </div>

        </div>
    </div>
</main>
